name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (python-for-android / Buildozer)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev automake build-essential \
            libltdl-dev ccache

      - name: Cache ccache (speeds up repeat NDK compiles)
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ~/.cache/ccache
          key: ccache-${{ hashFiles('buildozer.spec') }}
          restore-keys: ccache-

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Cache Buildozer global + project build directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: plus2cipher-debug-apk
          path: bin/*.apk
          if-no-files-found: error

  screenshot:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM group perms
        run: |
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: plus2cipher-debug-apk

      - name: Run Emulator and Snapshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            # Find and install the APK
            adb install -r *.apk
            
            # Launch the app
            adb shell monkey -p com.example.plus2cipher -c android.intent.category.LAUNCHER 1
            
            # Wait 10 seconds for the splash screen to finish and home screen to load
            sleep 10
            
            # Take screenshot of home screen
            adb exec-out screencap -p > android_home.png
            
            # Navigate to settings
            # We can use adb shell input tap to click settings, but it depends on screen resolution.
            # For now, just getting the Home screen is enough.
            
      - name: Upload Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: "*.png"
